<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-labelledby="t">
  <title id="t">Kyriakon.net</title>
  <rect width="1280" height="480" fill="#faf7f2"/>

  <!-- Chi-Rho mark, crimson, 1.25x stretched (matches site favicon) -->
  <text x="640" y="185" text-anchor="middle" dominant-baseline="central"
        font-family="Iowan Old Style" font-size="150" font-weight="700" fill="#7b1e26"
        transform="translate(640 0) scale(1.25 1) translate(-640 0)">☧</text>

  <!-- Wordmark -->
  <text x="640" y="320" text-anchor="middle"
        font-family="Iowan Old Style" font-size="52" font-weight="600" fill="#1c1a17"
        letter-spacing="-1.3">Kyriakon.net</text>

  <!-- Tagline -->
  <text x="640" y="392" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="24" fill="#1c1a17" fill-opacity="0.6">Principled software, built by Orthodox Christians.</text>
</svg>
