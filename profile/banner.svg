<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-labelledby="t">
  <title id="t">Kyriakon.net</title>
  <rect width="1280" height="480" fill="#faf7f2"/>

  <!-- Chi-Rho mark, crimson, 1.25x stretched (matches site favicon) -->
  <text x="640" y="140" text-anchor="middle" dominant-baseline="central"
        font-family="Iowan Old Style" font-size="215" font-weight="700" fill="#7b1e26"
        transform="translate(640 0) scale(1.25 1) translate(-640 0)">☧</text>

  <!-- Wordmark (Times bold - matches site rendering) -->
  <text x="640" y="308" text-anchor="middle"
        font-family="Times" font-size="118" font-weight="700" fill="#1c1a17"
        letter-spacing="-3">Kyriakon.net</text>

  <!-- Tagline 1 (system sans, ink) -->
  <text x="640" y="396" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="27" fill="#1c1a17">Secure email, static web hosting, and pass repositories.</text>

  <!-- Tagline 2 (system sans, muted) -->
  <text x="640" y="440" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="24" fill="#1c1a17" fill-opacity="0.6">Principled software, built by Orthodox Christians.</text>
</svg>
